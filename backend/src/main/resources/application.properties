# Server configuration
server.port=8080

# Database configurations with environment fallbacks
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aicourseDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_database_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security properties
security.jwt.secret=${JWT_SECRET:your_jwt_secret_here}
security.jwt.expiration=3600000

# File Upload configurations
app.upload.dir=./uploads


# AI Configuration
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.model=${OPENROUTER_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.timeout=120s
openrouter.max-retries=5

# Multipart configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging configuration
logging.level.com.aicoursegenerator=DEBUG
logging.level.com.aicoursegenerator.ai.service=DEBUG
logging.level.com.aicoursegenerator.chat.service=DEBUG
logging.level.com.aicoursegenerator.quiz.service=DEBUG
logging.level.org.springframework.security=INFO

# Brevo Email Configuration
brevo.api.key=${BREVO_API_KEY:}
brevo.from.email=${BREVO_FROM_EMAIL:}
brevo.from.name=${BREVO_FROM_NAME:CurriculaAI}
