version: '3.8'

services:
  omniroute:
    build: .
    ports:
      - "20128:20128"
    volumes:
      - omniroute-data:/app/data
    environment:
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: always

volumes:
  omniroute-data:
